<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock Shop - QR Scanner & Checkout</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1>🛍️ Digital Clock Shop</h1>
            <div class="cart-icon" id="cartIcon">
                <span class="cart-count" id="cartCount">0</span>
                🛒
            </div>
        </div>

        <div class="main-content">
            <!-- Scanner Section -->
            <div class="scanner-section">
                <div class="section-header">
                    <h2>📱 QR Code Scanner</h2>
                    <p>Scan product QR codes to add items to your cart</p>
                </div>

                <div class="scanner-container">
                    <video id="video" class="video-stream"></video>
                    <canvas id="canvas" style="display: none;"></canvas>
                    <div class="scanner-overlay">
                        <div class="scanner-box"></div>
                    </div>
                    <div class="scanner-controls">
                        <button id="startScanBtn" class="btn btn-primary">
                            🎥 Start Scanner
                        </button>
                        <button id="stopScanBtn" class="btn btn-secondary" style="display: none;">
                            ⏹️ Stop Scanner
                        </button>
                        <button id="uploadQRBtn" class="btn btn-info">
                            📤 Upload QR Code
                        </button>
                        <input type="file" id="qrFileInput" accept="image/*" style="display: none;">
                    </div>
                    <div id="scanMessage" class="scan-message"></div>
                </div>
            </div>

            <!-- Products Section -->
            <div class="products-section">
                <div class="section-header">
                    <h2>📦 Our Products</h2>
                    <p>Available digital clock products</p>
                </div>

                <div class="products-grid" id="productsGrid">
                    <!-- Products will be dynamically loaded here -->
                </div>
            </div>
        </div>

        <!-- Cart Sidebar -->
        <div class="cart-sidebar" id="cartSidebar">
            <div class="cart-header">
                <h3>Shopping Cart</h3>
                <button id="closeCartBtn" class="close-btn">×</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Cart items will appear here -->
            </div>
            <div class="cart-summary">
                <div class="summary-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-row">
                    <span>Tax (10%):</span>
                    <span id="tax">$0.00</span>
                </div>
                <div class="summary-row total">
                    <span>Total:</span>
                    <span id="total">$0.00</span>
                </div>
                <button id="checkoutBtn" class="btn btn-checkout">
                    💳 Proceed to Checkout
                </button>
                <button id="continueShopping" class="btn btn-secondary" style="width: 100%; margin-top: 10px;">
                    Continue Shopping
                </button>
            </div>
        </div>

        <!-- Overlay for cart sidebar -->
        <div class="overlay" id="overlay"></div>
    </div>

    <!-- Checkout Modal -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content checkout-modal">
            <h2>💳 Checkout</h2>
            
            <div id="checkoutSummary" class="checkout-summary">
                <!-- Order summary will appear here -->
            </div>

            <form id="checkoutForm" class="checkout-form">
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="address">Shipping Address *</label>
                    <textarea id="address" required placeholder="123 Main St, City, State 12345"></textarea>
                </div>

                <div class="form-group">
                    <label for="cardNumber">Card Number *</label>
                    <input type="text" id="cardNumber" required placeholder="1234 5678 9012 3456" maxlength="19">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="expiry">Expiry Date *</label>
                        <input type="text" id="expiry" required placeholder="MM/YY" maxlength="5">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV *</label>
                        <input type="text" id="cvv" required placeholder="123" maxlength="3">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-checkout">Complete Purchase</button>
                    <button type="button" class="btn btn-secondary" onclick="closeCheckoutModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="modal">
        <div class="modal-content success-modal">
            <div class="success-icon">✅</div>
            <h2>Order Confirmed!</h2>
            
            <div id="successMessage" class="success-message">
                <!-- Success message will appear here -->
            </div>

            <div id="orderDetails" class="order-details">
                <!-- Order details will appear here -->
            </div>

            <div class="success-actions">
                <button class="btn btn-primary" onclick="closeSuccessModal()">
                    🏠 Back to Shopping
                </button>
            </div>
        </div>
    </div>

    <!-- QR Library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
